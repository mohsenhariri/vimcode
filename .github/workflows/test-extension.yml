name: Test extension

on:
  push:
    branches: ['**']
    # Release tags run these tests through publish-marketplace.yml.
    tags-ignore: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      upload-vsix:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            vscode: "1.120.0"
          - os: ubuntu-latest
            vscode: stable
          - os: macos-latest
            vscode: stable
          - os: windows-latest
            vscode: stable
    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run extension-host and launcher tests
        if: runner.os != 'Linux'
        run: npm test
      - name: Run extension-host and launcher tests under Xvfb
        if: runner.os == 'Linux'
        run: env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 xvfb-run -a npm test
      - name: Exercise the packaged extension in a fresh window
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package="$RUNNER_TEMP/vimcode.vsix"
          npm run vsix -- --out "$package"
          unzip -t "$package"
          env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 VIMCODE_VSIX="$package" xvfb-run -a node scripts/run-tests.js --ui
      - name: Upload the tested VSIX for publishing
        if: inputs.upload-vsix && runner.os == 'Linux' && matrix.vscode == 'stable'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: marketplace-vsix
          path: ${{ runner.temp }}/vimcode.vsix
          if-no-files-found: error
          overwrite: true
