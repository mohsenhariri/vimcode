name: Publish to Visual Studio Marketplace

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'mohsenhariri/vimcode' && github.event.created
    uses: ./.github/workflows/test-extension.yml
    with:
      upload-vsix: true

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate the release version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME must match package.json version v$version."
            exit 1
          fi
      - name: Install the publishing CLI
        run: npm ci --ignore-scripts
      - name: Download the tested VSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: marketplace-vsix
          path: ${{ runner.temp }}
      - name: Publish the tested VSIX
        run: npm exec --no -- vsce publish --oidc --packagePath "$RUNNER_TEMP/vimcode.vsix"
